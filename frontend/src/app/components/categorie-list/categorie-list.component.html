<div class="container-principal page-categories">

  <div class="breadcrumb-elegant">
    <a routerLink="/accueil">E-shop</a>
    <span class="mx-2">/</span>
    <span class="actif">Categories</span>
  </div>

  <div class="entete-page">
    <div>
      <h1 class="titre-page">Categories</h1>
      <p class="sous-titre-page">{{ categories.length }} categories</p>
    </div>
    <a routerLink="/categories/ajouter" class="btn btn-violet">Ajouter une categorie</a>
  </div>

  <div class="tableau-zone">
    <table class="table table-elegant">
      <thead>
        <tr>
          <th>Image</th>
          <th>Nom</th>
          <th>Description</th>
          <th class="text-end">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let categorie of categories">
          <td>
            <img [src]="categorie.image || 'https://via.placeholder.com/80'" [alt]="categorie.nom" class="image-categorie">
          </td>
          <td class="nom-categorie">{{ categorie.nom }}</td>
          <td class="description-categorie">{{ categorie.description }}</td>
          <td class="text-end">
            <a [routerLink]="['/categories/modifier', categorie.id]" class="bouton-action">Modifier</a>
            <button class="bouton-action bouton-supprimer" (click)="supprimer(categorie.id!, categorie.nom)">Supprimer</button>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="text-center py-5" *ngIf="categories.length === 0">
      <p class="texte-vide">Aucune categorie trouvee</p>
    </div>
  </div>

</div>
